<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<link rel="stylesheet" href="{{ASSET_PREFIX}}katex/katex.min.css">
<style>
@font-face {
  font-family: "TeX Gyre Termes";
  src: url("{{ASSET_PREFIX}}fonts/texgyretermes-regular.otf") format("opentype");
  font-weight: 400;
  font-style: normal;
}
@font-face {
  font-family: "TeX Gyre Termes";
  src: url("{{ASSET_PREFIX}}fonts/texgyretermes-italic.otf") format("opentype");
  font-weight: 400;
  font-style: italic;
}
@font-face {
  font-family: "TeX Gyre Termes";
  src: url("{{ASSET_PREFIX}}fonts/texgyretermes-bold.otf") format("opentype");
  font-weight: 700;
  font-style: normal;
}
body {
  background: #faf8f5;
  font-family: "TeX Gyre Termes", "Times New Roman", serif;
  font-size: 14pt;
  line-height: 1.2;
  margin: 0;
  padding: 2rem 1.5rem;
}
.katex {
  font-size: 1em;
}
main {
  max-width: 52em;
  margin: 0 auto;
  text-align: left;
}
nav.site-nav {
  margin-bottom: 1.5em;
  text-align: center;
}
nav.site-nav a {
  color: inherit;
  text-decoration: none;
}
nav.site-nav a:hover {
  text-decoration: underline;
  text-decoration-color: rgba(0, 0, 0, 0.35);
  text-underline-offset: 0.15em;
}
a:link,
a:visited {
  color: #24536b;
  text-decoration: underline;
  text-decoration-color: rgba(36, 83, 107, 0.35);
  text-underline-offset: 0.18em;
  text-decoration-thickness: 1px;
}
a:hover {
  text-decoration-color: currentColor;
}
.center {
  text-align: center;
}
img.note-figure {
  display: block;
  height: auto;
  margin: 0.75em auto;
  max-width: min(100%, 40em);
}
img.note-figure.framed {
  box-shadow: 0 0 0 1px #000;
}
.small-caps,
.katex .small-caps {
  font-variant: small-caps;
}
code {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.88em;
}
section.env {
  margin: 1em 0;
}
section.env .katex {
  color: inherit;
}
section.env > p:first-child {
  margin-top: 0;
}
blockquote.quote {
  border-left: 3px solid #ccc;
  margin: 1em 0;
  padding-left: 1em;
}
ul {
  margin: 0.5em 0;
  padding-left: 1.5em;
}
ol {
  margin: 0.5em 0;
  padding-left: 1.5em;
}
li > p {
  margin: 0.25em 0;
}
ul.itemize-labeled,
ol.enumerate-labeled {
  list-style: none;
  padding-left: 0;
  margin: 0.5em 0;
}
ul.itemize-labeled > li.item-labeled,
ol.enumerate-labeled > li.item-labeled {
  display: grid;
  grid-template-columns: auto 1fr;
  column-gap: 0.5em;
  align-items: baseline;
  margin: 0;
}
ul.itemize-labeled > li.item-labeled > .item-label,
ol.enumerate-labeled > li.item-labeled > .item-label {
  grid-column: 1;
  white-space: nowrap;
}
ul.itemize-labeled > li.item-labeled > .item-body,
ol.enumerate-labeled > li.item-labeled > .item-body {
  grid-column: 2;
  min-width: 0;
}
ul.itemize-labeled > li.item-labeled > .item-body > p:first-child,
ol.enumerate-labeled > li.item-labeled > .item-body > p:first-child {
  margin-top: 0;
}
ul.itemize-labeled > li.item-labeled > .item-body > p:last-child,
ol.enumerate-labeled > li.item-labeled > .item-body > p:last-child {
  margin-bottom: 0;
}
ul.itemize-labeled > li.item-labeled + li.item-labeled,
ol.enumerate-labeled > li.item-labeled + li.item-labeled {
  margin-top: 0.25em;
}
.boxed-text {
  border: 1px solid #333;
  margin: 0.9em auto;
  padding: 0.55em 0.5em;
  text-align: center;
}
.boxed-text p {
  margin: 0.15em 0;
}
.boxed-text p:first-child {
  margin-top: 0;
}
.boxed-text p:last-child {
  margin-bottom: 0;
}
.vskip {
  display: block;
  margin: 0;
  padding: 0;
  border: 0;
  overflow: hidden;
}
.vskip-pull {
  height: 0;
}
.circled {
  border: 1px solid currentColor;
  border-radius: 50%;
  box-sizing: border-box;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1.35em;
  height: 1.35em;
  padding: 0;
  line-height: 1;
  vertical-align: -0.125em;
}
hr {
  border: none;
  border-top: 1px solid #333;
  margin: 1.5em 0;
  width: min(100%, 24em);
}
header.lecture-header {
  margin-bottom: 2.5em;
  text-align: center;
}
header.lecture-header h1 {
  font-size: 2em;
  font-weight: 700;
  margin: 0 0 0.25em;
}
header.lecture-header .lecture-title {
  font-style: italic;
  font-size: 1.25em;
  margin: 0;
}
h2.heading-section {
  font-size: 1.5em;
  font-weight: 700;
  margin: 2.25em 0 0.75em;
}
main > h2.heading-section:first-of-type,
section.lecture > h2.heading-section:first-of-type {
  margin-top: 1.5em;
}
h3.heading-subsection {
  font-size: 1.3em;
  font-weight: 700;
  margin: 1.75em 0 0.6em;
  scroll-margin-top: 1.5em;
}
.subsection-marker {
  font-weight: 700;
}
h4.heading-subsubsection {
  font-size: 1em;
  font-weight: 700;
  margin: 1.25em 0 0.5em;
}
section.lecture {
  margin-bottom: 2.5em;
  padding-bottom: 2.5em;
  border-bottom: 1px solid #ccc;
}
section.lecture:last-child {
  border-bottom: none;
  margin-bottom: 0;
  padding-bottom: 0;
}
h1 {
  font-size: 1.1em;
  font-weight: 700;
  margin: 0 0 1em;
  text-align: center;
}
ul.note-list {
  list-style: none;
  margin: 0 0 1.5em;
  padding: 0;
  text-align: center;
}
ul.note-list li {
  margin: 0.4em 0;
}
nav.toc-outline {
  display: block;
  margin: 0 0 1.5em;
  padding-left: 1em;
  border-left: 2px solid #ddd;
  text-align: left;
}
section.toc-part {
  margin: 0;
  padding: 0;
}
section.toc-part + section.toc-part {
  margin-top: 1.15em;
}
h2.toc-part-title {
  font-size: 1.3em;
  font-weight: 700;
  margin: 0 0 0.45em;
  padding: 0;
  border: none;
  letter-spacing: 0.015em;
}
h2.toc-part-title .toc-part-marker {
  margin-right: 0.15em;
  opacity: 0.8;
}
section.toc-part:first-child h2.toc-part-title {
  margin-top: 0;
}
ul.toc-lectures {
  list-style: none;
  margin: 0;
  padding: 0;
}
ul.toc-lectures > li.lecture-toc-entry {
  margin: 0;
  padding: 0.45em 0;
  list-style: none;
}
a.lecture-toc-link {
  font-weight: 600;
}
ul.subsection-toc {
  list-style: none;
  margin: 0.3em 0 0;
  padding: 0 0 0 1.1em;
}
ul.subsection-toc li {
  margin: 0.2em 0;
  padding: 0;
  list-style: none;
}
a.toc-subsection-link {
  font-size: 0.93em;
}
a.toc-subsection-link .katex {
  font-size: 0.95em;
}
.toc-subsection-marker {
  opacity: 0.65;
}
p.all-link {
  margin: 0 0 1.25em;
  text-align: left;
}
</style>
</head>
<body>
<main>{{CONTENT}}</main>
</body>
</html>
